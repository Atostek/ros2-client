on:
  push:
    branches: [master]
  pull_request:

name: CI / Static Checks

permissions: read-all

jobs:

  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The nightly the tree is formatted with. `wrap_comments` is unstable and
      # its wrapping changes between nightlies, so a floating toolchain fails
      # this check on untouched files and forces a repo-wide sweep each time.
      # To move it: bump the date, run `cargo +nightly-<date> fmt`, commit both.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-22
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc

  clippy:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: giraffate/clippy-action@v1
        with:
          clippy_flags: --all --lib --bins --examples
          filter_mode: nofilter

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - run: cargo check
